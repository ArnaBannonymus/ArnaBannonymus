<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b090a"><title>Backhaus Nahrstedt</title><style>html,body{margin:0;height:100%;background:#0b090a;color:#fff;font-family:system-ui}#boot{height:100%;display:grid;place-items:center}.b{width:42px;height:42px;border:3px solid #ffffff22;border-top-color:#d9ff72;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><div id="boot"><div><div class="b"></div><p>Backhaus Nahrstedt wird geladen…</p></div></div><script>(async()=>{try{const files=["part-00.txt","part-01.txt","part-02.txt","part-03.txt","part-04.txt"];let b='';for(const f of files)b+=await(await fetch(f)).text();const bin=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<main style="padding:40px"><h1>Backhaus Nahrstedt</h1><p>Die Vorschau konnte nicht geladen werden.</p></main>';console.error(e)}})();</script></body></html>
