<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0908"><title>Backhaus Nahrstedt · Digital Experience Ilmenau</title><style>html,body{margin:0;height:100%;background:#0a0908;color:#fff;font-family:system-ui}#boot{height:100%;display:grid;place-items:center;text-align:center}.s{width:44px;height:44px;border:3px solid #ffffff22;border-top-color:#d9ff68;border-radius:50%;animation:r .75s linear infinite;margin:auto}@keyframes r{to{transform:rotate(360deg)}}p{color:#aaa;font-size:11px;letter-spacing:.13em;text-transform:uppercase}</style></head><body><div id="boot"><div><div class="s"></div><p>Backhaus Nahrstedt wird geladen…</p></div></div><script>(async()=>{try{let b='';for(const f of ["part-00.txt","part-01.txt","part-02.txt","part-03.txt"]) b+=await(await fetch(f)).text();const u=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const h=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<main style="padding:40px"><h1>Backhaus Nahrstedt</h1><p>Die Präsentation konnte nicht geladen werden.</p></main>'}})();</script></body></html>
